name: Build and Push Docker Image

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    env:
      IMAGE: ${{ secrets.DOCKER_USERNAME }}/wow-random-event

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine release type
        id: release
        run: |
          VERSION=$(node -p "require('./package.json').version")
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

          if git ls-remote --tags origin "refs/tags/v${VERSION}" | grep -q .; then
            echo "is_release=false" >> "$GITHUB_OUTPUT"
            echo "docker_tag=v${VERSION}-beta.${SHORT_SHA}" >> "$GITHUB_OUTPUT"
            echo "No version bump — tagging as beta: v${VERSION}-beta.${SHORT_SHA}"
          else
            echo "is_release=true" >> "$GITHUB_OUTPUT"
            echo "docker_tag=v${VERSION}" >> "$GITHUB_OUTPUT"
            echo "Version bumped — tagging as release: v${VERSION}"
          fi

      - name: Log in to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: |
          TAGS="-t ${IMAGE}:${{ steps.release.outputs.docker_tag }}"
          if [ "${{ steps.release.outputs.is_release }}" = "true" ]; then
            TAGS="${TAGS} -t ${IMAGE}:latest"
          fi
          docker build --platform linux/amd64 ${TAGS} .

      - name: Push Docker image
        run: |
          docker push "${IMAGE}:${{ steps.release.outputs.docker_tag }}"
          if [ "${{ steps.release.outputs.is_release }}" = "true" ]; then
            docker push "${IMAGE}:latest"
          fi

      - name: Create GitHub tag and release
        if: steps.release.outputs.is_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.release.outputs.version }}
          name: v${{ steps.release.outputs.version }}
          generate_release_notes: true
